name: Docker Desktop Deploy

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build Docker image
      run: |
        echo "🔨 Building Docker image..."
        docker build -t astrapay-spring-boot-external:latest .
        
    - name: Install kubectl
      run: |
        echo "📦 Installing kubectl..."
        # Check if kubectl is already installed
        if ! command -v kubectl &> /dev/null; then
          # Install kubectl for Linux
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
        else
          echo "kubectl already installed"
        fi
        kubectl version --client
        
    - name: Configure kubectl for Docker Desktop
      run: |
        echo "🔧 Configuring kubectl for Docker Desktop..."
        
        # Create kubeconfig directory
        mkdir -p ~/.kube
        
        # Configure kubectl using kubectl config commands (more reliable)
        kubectl config set-cluster docker-desktop https://kubernetes.docker.internal:6443
        kubectl config set-context docker-desktop --cluster=docker-desktop --user=docker-desktop
        kubectl config use-context docker-desktop
        kubectl config set-credentials docker-desktop --exec-command=exec --api-version=v1.22 --exec-args=command
        
        # Verify configuration
        kubectl config view || echo "Warning: Configuration may have issues"
        
        export KUBECONFIG=~/.kube/config
        
        # Test connection
        kubectl cluster-info || echo "Warning: Cannot connect to cluster, will continue with deployment"
        
    - name: Deploy to Docker Desktop Kubernetes
      run: |
        echo "🚀 Deploying to Docker Desktop Kubernetes..."
        
        export KUBECONFIG=~/.kube/config
        
        # Apply individual YAML files with server validation disabled
        kubectl apply -f k8s/namespace.yaml --validate=false --server-side=false
        kubectl apply -f k8s/configmap.yaml --validate=false --server-side=false
        kubectl apply -f k8s/secret.yaml --validate=false --server-side=false
        kubectl apply -f k8s/app-deployment.yaml --validate=false --server-side=false
        kubectl apply -f k8s/postgres-deployment.yaml --validate=false --server-side=false
        kubectl apply -f k8s/redis-deployment.yaml --validate=false --server-side=false
        
        # Wait for deployment
        kubectl rollout status deployment/astrapay-app -n astrapay --timeout=300s
        
        # Get deployment status
        kubectl get pods -n astrapay
        kubectl get services -n astrapay
        
        echo "✅ Deployment completed!"
        echo "🌐 Access application:"
        echo "   kubectl port-forward service/astrapay-service 8000:8000 -n astrapay"
        echo "   Then open: http://localhost:8000"
        
    - name: Health Check
      run: |
        echo "🔍 Verifying deployment health..."
        sleep 30
        kubectl wait --for=condition=ready pod -l app=astrapay-app -n astrapay --timeout=300s
        echo "✅ Application is healthy and ready!"

apiVersion: v1
kind: ConfigMap
metadata:
  name: astrapay-config
  namespace: astrapay
data:
  application.properties: |
    # Server Configuration
    server.port=8000
    
    # Database Configuration (PostgreSQL)
    spring.datasource.url=jdbc:postgresql://postgres-service:5432/astrapay_db
    spring.datasource.username=astrapay_user
    spring.datasource.password=astrapay_password
    spring.datasource.driver-class-name=org.postgresql.Driver
    
    # JPA/Hibernate Configuration
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=false
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
    
    # Redis Configuration
    spring.redis.host=redis-service
    spring.redis.port=6379
    
    # Logging Configuration
    logging.level.com.astrapay=INFO
    logging.level.org.springframework=WARN
    logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
    
    # Management/Actuator Configuration
    management.endpoints.web.exposure.include=health,info,metrics
    management.endpoint.health.show-details=when-authorized

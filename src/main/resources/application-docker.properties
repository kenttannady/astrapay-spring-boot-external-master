# Server Configuration
server.port=8000

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgres-db:5432/astrapay_db
spring.datasource.username=astrapay_user
spring.datasource.password=astrapay_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.redis.host=redis-cache
spring.redis.port=6379

# Logging Configuration
logging.level.com.astrapay=DEBUG
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=/app/logs/application.log

# Management/Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.server.port=8001
